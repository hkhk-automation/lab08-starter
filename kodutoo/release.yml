# Kodutöö: väljalase tag'iga (v1.0.0, v1.1.0, ...).
# Kopeeri see fail kausta .github/workflows/ ja leia vead (kodutöö samm 2).
name: Release

on:
  push:
    tags: ["V*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image'i nimi
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Ehita image
        run: >
          docker build
          --build-arg VERSIOON=${{ github.ref }}
          --label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          -t "$IMAGE:${{ github.ref }}"
          ./flask
      - name: Logi GHCR-i sisse
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Saada image GHCR-i
        run: docker push "$IMAGE:${{ github.ref }}"
